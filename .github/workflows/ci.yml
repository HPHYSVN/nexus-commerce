name: CI
on: [push, pull_request]

jobs:
  product:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/product } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

  api-gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api-gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/api-gateway/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [product, api-gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build product api-gateway frontend
