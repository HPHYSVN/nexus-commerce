name: CI
on: [push, pull_request]

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product, cart, notification]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory, payment, order]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./...
      - run: go test ./...

  identity:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/identity } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -q -B test

  api-gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api-gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/api-gateway/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python-services, go-services, identity, api-gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && break || sleep 5
          done
          curl -sf http://localhost:3000/api/products
          curl -sf http://localhost:5173/ > /dev/null
      - name: System test suites (e2e, security, attack, concurrency, flash-sale, load)
        run: |
          set -a; source .env; set +a
          sleep 20
          # security.sh ends with a rate-limit hammer that exhausts the auth
          # quota for ~60s, so it must run LAST.
          bash tests/e2e.sh
          bash tests/attack.sh
          bash tests/concurrency.sh
          bash tests/flash-sale.sh
          bash tests/load.sh
          bash tests/security.sh
      - if: always()
        run: docker compose down -v

  deploy:
    # CD to the Fly.io Sprite. Requires repo secret SPRITE_TOKEN
    # (format: org-slug/org-id/token-id/token-value — create an API token in
    # the Fly.io Sprites dashboard, then `gh secret set SPRITE_TOKEN`).
    # Without the secret the job passes with a notice instead of failing.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [python-services, go-services, identity, api-gateway, frontend, docker]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.SPRITE_TOKEN }}" ]; then
            echo "::notice::SPRITE_TOKEN secret not set — skipping deploy. Create a Sprites API token and add it to enable CD."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ready == 'true'
        run: curl -fsSL https://sprites.dev/install.sh | sh
      - if: steps.creds.outputs.ready == 'true'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          sprite auth setup --token "${{ secrets.SPRITE_TOKEN }}"
          sprite exec -s my-first-sprite --no-stdin -- bash -c 'cd ~/nexus-commerce && git pull -q && bash deploy/sprite/deploy.sh'
      - if: steps.creds.outputs.ready == 'true'
        run: |
          sleep 10
          curl -sf https://my-first-sprite-b5urg.sprites.app/api/products > /dev/null
          curl -sf https://my-first-sprite-b5urg.sprites.app/ > /dev/null
          echo "Deployed and live."
