name: CI
on: [push, pull_request]

jobs:
  python-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product, cart, notification]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -q

  go-services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [inventory, payment, order]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - run: go vet ./...
      - run: go test ./...

  identity:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/identity } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -q -B test

  api-gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api-gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: services/api-gateway/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python-services, go-services, identity, api-gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
      - name: Smoke test the stack
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/health && break || sleep 5
          done
          curl -sf http://localhost:3000/api/products
          curl -sf http://localhost:5173/ > /dev/null
      - if: always()
        run: docker compose down -v
