name: nexus-commerce

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PRODUCT_DB_PASSWORD: ${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD must be set in .env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set in .env}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD must be set in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [nexus]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [nexus]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nexus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [nexus]
    # ports: ["15672:15672"]  # dev only: management UI

  identity:
    build: ./services/identity
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: identity_db
      DB_USER: identity_user
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nexus.local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  product:
    build: ./services/product
    environment:
      DATABASE_URL: postgresql+psycopg://product_user:${PRODUCT_DB_PASSWORD:?PRODUCT_DB_PASSWORD must be set in .env}@postgres:5432/product_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  cart:
    build: ./services/cart
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  notification:
    build: ./services/notification
    environment:
      DATABASE_URL: postgresql+psycopg://notification_user:${NOTIFICATION_DB_PASSWORD:?NOTIFICATION_DB_PASSWORD must be set in .env}@postgres:5432/notification_db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  inventory:
    build: ./services/inventory
    environment:
      DATABASE_URL: postgres://inventory_user:${INVENTORY_DB_PASSWORD:?INVENTORY_DB_PASSWORD must be set in .env}@postgres:5432/inventory_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  payment:
    build: ./services/payment
    environment:
      DATABASE_URL: postgres://payment_user:${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set in .env}@postgres:5432/payment_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  order:
    build: ./services/order
    environment:
      DATABASE_URL: postgres://order_user:${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD must be set in .env}@postgres:5432/order_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INVENTORY_URL: http://inventory:8082
      PAYMENT_URL: http://payment:8084
      PRODUCT_URL: http://product:8001
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-nexus}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      inventory: { condition: service_healthy }
      payment: { condition: service_healthy }
      product: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  api-gateway:
    build: ./services/api-gateway
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      IDENTITY_SERVICE_URL: http://identity:8081
      PRODUCT_SERVICE_URL: http://product:8001
      CART_SERVICE_URL: http://cart:8002
      NOTIFICATION_SERVICE_URL: http://notification:8003
      INVENTORY_SERVICE_URL: http://inventory:8082
      ORDER_SERVICE_URL: http://order:8083
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5173}
    ports: ["${GATEWAY_PORT:-3000}:3000"]
    depends_on:
      product: { condition: service_healthy }
    restart: unless-stopped
    networks: [nexus]

  frontend:
    build: ./frontend
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on: [api-gateway]
    restart: unless-stopped
    networks: [nexus]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  nexus:
    driver: bridge
